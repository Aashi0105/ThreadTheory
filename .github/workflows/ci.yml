name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite (Python & Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Initialize SQLite database
        run: |
          python setup_db.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run Python test suite
        env:
          USE_DETERMINISTIC_STYLIST: "true"
          SESSION_SECRET: "ci_test_session_secret_32_characters_minimum_2026"
        run: |
          python -m pytest tests/ -v

      - name: Run Node.js security test suites
        env:
          SESSION_SECRET: "ci_test_session_secret_32_characters_minimum_2026"
        run: |
          node tests/test_static_exposure.js
          node tests/test_auth_foundation.js
          node tests/test_route_authorization.js
